name: UITNU motor

# Elke drie uur een ronde: nieuwe websites testen, goede bronnen aanzetten, agenda's ophalen,
# keuren en publiceren. Daarna bouwt Cloudflare de site opnieuw (gratis tot 500 keer per maand;
# dit zijn er hooguit 8 per dag). GitHub Actions is gratis: dit is een openbare repo. GitHub slaat
# geplande rondes soms over of begint later; dan komt de volgende gewoon.
# Om kleine websites te sparen: elke agenda hooguit om de zes uur ophalen, nieuwe plekken zoeken
# eens per week. Met de hand gestart doet de motor alles.
# Met de hand gestart met 'alleen publiceren': geen zoeken of ophalen, alleen de fabriek met de nieuwste
# regels en de site opnieuw bouwen (bijvoorbeeld om iets snel van de site te halen).
# Werkgebied: Noord-Nederland (pipeline/area.py). Een ronde duurt hooguit ongeveer twee uur; de rondes
# wachten op elkaar (concurrency hieronder).
on:
  schedule:
    - cron: '23 */3 * * *'
  workflow_dispatch:
    inputs:
      alleen_publiceren:
        description: "Alleen opnieuw publiceren met de nieuwste regels (niet zoeken of ophalen; duurt een paar minuten)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: uitnu-motor
  cancel-in-progress: false

jobs:
  motor:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Nieuwe plekken en festivals zoeken (eens per week, of bij handmatig starten)
        if: ${{ !inputs.alleen_publiceren }}
        continue-on-error: true
        timeout-minutes: 20
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python -m collector.discover_venues --queue data/source_candidates.json
          else
            python -m collector.discover_venues --queue data/source_candidates.json --every-days 7
          fi

      - name: Dorpswebsites zoeken (per plaats; elke plaats eens per drie maanden)
        if: ${{ !inputs.alleen_publiceren }}
        continue-on-error: true
        timeout-minutes: 20
        run: python -m collector.village_sites --store data/dorpssites.json --budget-minutes 15 --summary

      - name: Websites testen (eerst tips en nieuwe websites) en goede bronnen aanzetten
        if: ${{ !inputs.alleen_publiceren }}
        continue-on-error: true
        timeout-minutes: 50
        run: |
          python -m collector.discover_venues --queue data/source_candidates.json --tips-only
          python -m collector.source_probe --queue data/source_candidates.json --limit 500 --workers 16 --deep-pages 3 --budget-minutes 40 --summary
          python -m collector.auto_activate

      - name: Agenda's ophalen (elke bron hooguit om de zes uur; na 35 minuten afronden met wat er is)
        if: ${{ !inputs.alleen_publiceren }}
        continue-on-error: true
        timeout-minutes: 50
        run: |
          VERS=5
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then VERS=0; fi
          python -m pipeline.stage_active_sources --sources collector/web_crawl_sources.json --workers 24 --timeout 12 --budget-minutes 35 --fetch-log data/opgehaald.json --fresh-hours $VERS --output /tmp/staging.json > /dev/null
          python -m pipeline.build_auto_events --curated data/events.json --staged /tmp/staging.json --output data/auto_events.json

      - name: Kaartpin zetten bij handmatige uitjes met alleen een plaatsnaam
        if: ${{ !inputs.alleen_publiceren }}
        continue-on-error: true
        timeout-minutes: 5
        run: python -m collector.geocode_curated --file data/events.json

      - name: Foto's zoeken (organisator, anders Wikimedia Commons)
        if: ${{ !inputs.alleen_publiceren }}
        continue-on-error: true
        timeout-minutes: 12
        run: python -m collector.event_photos --data data --cache data/photos.json

      - name: Tests
        run: |
          python -m pip install --quiet pytest
          python -m pytest tests/v2 -q -p no:cacheprovider

      - name: Fabriek (de keuring beslist)
        id: fabriek
        continue-on-error: true
        run: python -m pipeline.v2.build --data data --out data/v2

      - name: Opslaan
        id: opslaan
        run: |
          if [ "${{ steps.fabriek.outcome }}" != "success" ]; then
            echo "Keuring afgekeurd: de vorige agenda blijft staan, de voortgang met bronnen wordt wel bewaard."
            git checkout -- data/auto_events.json data/v2 2>/dev/null || true
            rm -f data/v2/events.rejected.json
            # Volgende ronde alles opnieuw ophalen (de afgekeurde lezing telt niet).
            git checkout -- data/opgehaald.json 2>/dev/null || rm -f data/opgehaald.json
          fi
          git add data collector/web_crawl_sources.json
          if git diff --cached --quiet; then echo "veranderd=nee" >> "$GITHUB_OUTPUT"; echo "Geen wijzigingen."; exit 0; fi
          git diff --cached --quiet -- data/v2/events.json && echo "agenda=nee" >> "$GITHUB_OUTPUT" || echo "agenda=ja" >> "$GITHUB_OUTPUT"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "motor: $(python -c 'import json;print(len(json.load(open("data/v2/events.json"))))') uitjes, $(python -c 'import json;print(sum(1 for s in json.load(open("collector/web_crawl_sources.json"))["sources"] if s.get("enabled")))') actieve bronnen"
          git pull -q --rebase origin main
          git push -q
          echo "veranderd=ja" >> "$GITHUB_OUTPUT"

      - name: Site opnieuw laten bouwen
        if: steps.opslaan.outputs.agenda == 'ja'
        env:
          HOOK: ${{ secrets.CF_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then echo "Geen deploy hook ingesteld; de site wordt bij de volgende push bijgewerkt."; exit 0; fi
          curl -fsS -X POST "$HOOK" > /dev/null && echo "Cloudflare bouwt de site opnieuw."

      - name: Melden als de keuring afkeurde
        if: steps.fabriek.outcome != 'success'
        run: |
          echo "De keuring keurde de nieuwe agenda af. Zie de stap 'Fabriek' voor de reden."
          exit 1
